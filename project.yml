name: GooseAgent
options:
  bundleIdPrefix: dev.eachann
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
packages:
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm
    # Prebuilt libghostty xcframework — pin exactly and review the checksum diff
    # on every bump (supply-chain discipline for a binary dependency). The
    # version scheme is <major.minor>.<UTC yyyymmdd>, so `from:` would drift.
    exactVersion: "1.6.20260909"
targets:
  GooseAgent:
    type: application
    platform: macOS
    sources:
      - Sources/GooseAgent
      - path: Resources
        buildPhase: resources
        excludes:
          - Localizable.xcstrings
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: GhosttyTerminal
        product: GhosttyTerminal
      - package: GhosttyTerminal
        product: GhosttyTheme
    info:
      path: Sources/GooseAgent/Info.plist
      properties:
        CFBundleName: "Goose Agent"
        CFBundleDisplayName: "Goose Agent"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: dev.eachann.gooseagent
            CFBundleURLSchemes:
              - gooseagent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eachann.gooseagent
        PRODUCT_NAME: "Goose Agent"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
