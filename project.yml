name: GooseAgent
options:
  bundleIdPrefix: dev.eachann
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
packages:
  GooseKit:
    path: Packages/GooseKit
  GooseSSH:
    path: Packages/GooseSSH
  GooseTailcat:
    path: Packages/GooseTailcat
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm
    # Prebuilt libghostty xcframework — pin exactly and review the checksum diff
    # on every bump (supply-chain discipline for a binary dependency). The
    # version scheme is <major.minor>.<UTC yyyymmdd>, so `from:` would drift.
    exactVersion: "1.6.20260909"
targets:
  GooseAgent:
    type: application
    platform: macOS
    sources:
      - Sources/GooseAgent
      - path: Resources
        buildPhase: resources
        excludes:
          - Localizable.xcstrings
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: GooseKit
      - package: GooseTailcat
        product: GooseTailcat
      - package: GhosttyTerminal
        product: GhosttyTerminal
    postBuildScripts:
      - name: Package usage helper
        basedOnDependencyAnalysis: false
        script: |
          for arch in $ARCHS; do
            bash "$SRCROOT/scripts/package-usage-helper.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/UsageHelper" "$arch"
          done
    info:
      path: Sources/GooseAgent/Info.plist
      properties:
        CFBundleName: "Goose Agent"
        CFBundleDisplayName: "Goose Agent"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eachann.gooseagent
        PRODUCT_NAME: "Goose Agent"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          # real identity so UserNotifications & friends work in dev builds
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"

  GooseAgentMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources/GooseAgentMobile
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: GooseKit
      - package: GooseSSH
      - package: GooseTailcat
        product: GooseTailcat
      - package: GhosttyTerminal
        product: GhosttyTerminal
    info:
      path: Sources/GooseAgentMobile/Info.plist
      properties:
        CFBundleName: "Goose Agent"
        CFBundleDisplayName: "Goose Agent"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          Goose Agent connects to your Macs over SSH on your local network to reach
          the Goose Agent session running on them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eachann.gooseagent.ios
        PRODUCT_NAME: "Goose Agent"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NCFNX3LJ83
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The bundled libssh2/OpenSSL xcframeworks ship arm64 device + arm64
        # simulator slices only (see Packages/GooseSSH/Artifacts/PROVENANCE.md).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64
