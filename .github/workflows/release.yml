name: Release

# 打 v* tag 时触发：构建 macOS 安装包，连同签名更新清单一起发布到 GitHub Release。
# 新客户端读取 appcast.xml；保留 latest.json 供旧客户端升级。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish macOS
    runs-on: macos-latest
    env:
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch tag message
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Validate update signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        run: |
          set -euo pipefail
          for name in SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY UPDATE_SIGN_KEY; do
            if [ -z "${!name}" ]; then echo "::error::缺少更新签名配置 $name"; exit 1; fi
          done

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build libghostty
        run: ./scripts/build-libghostty.sh

      - name: Build
        run: |
          xcodebuild \
            -project 1Agent.xcodeproj \
            -scheme 1Agent \
            -configuration Release \
            -derivedDataPath build/DerivedData.noindex \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -arch arm64 \
            build \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/Resources/AdHoc.entitlements" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))" \
            CODE_SIGN_STYLE=Manual \
            -skipPackagePluginValidation

      - name: Package
        run: |
          app="build/DerivedData.noindex/Build/Products/Release/1Agent.app"
          ./scripts/sign-sparkle.sh "$app" -
          codesign --force --options runtime --timestamp=none --sign - --entitlements Resources/AdHoc.entitlements "$app"
          codesign --verify --deep --strict "$app"
          stage="$(mktemp -d)"
          mkdir -p dist
          ditto "$app" "$stage/1Agent.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "1Agent" -srcfolder "$stage" -ov -format UDZO -quiet "dist/1Agent-${GITHUB_REF_NAME}-mac-arm64.dmg"
          rm -rf "$stage"

      - name: Sign update manifest
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        run: |
          if [ -z "$UPDATE_SIGN_KEY" ]; then
            echo "::error::未配置 Secret UPDATE_SIGN_KEY，无法签名更新清单"
            exit 1
          fi
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          printf '%s' "$notes" > dist/notes.txt
          if [ ! -s dist/notes.txt ]; then
            printf '%s\n' "$GITHUB_REF_NAME" > dist/notes.txt
          fi
          min="$(python3 -c 'import json; print(json.load(open("release/update-policy.json")).get("minSupportedVersion", ""))')"
          swift scripts/update-manifest.swift \
            --version "$GITHUB_REF_NAME" \
            --package "dist/1Agent-${GITHUB_REF_NAME}-mac-arm64.dmg" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --notes-file dist/notes.txt \
            --min "$min" \
            --out dist

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          package="1Agent-${GITHUB_REF_NAME}-mac-arm64"
          cp dist/notes.txt "dist/$package.txt"
          tools="build/SourcePackages/artifacts/sparkle/Sparkle/bin"
          "$tools/generate_appcast" --ed-key-file "$key" --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" --embed-release-notes --maximum-deltas 0 dist
          "$tools/sign_update" --verify --ed-key-file "$key" dist/appcast.xml
          signature="$(python3 -c 'import sys, xml.etree.ElementTree as E; e=E.parse("dist/appcast.xml").find("./channel/item/enclosure"); s=e.get("{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature", ""); assert s, "更新包缺少 Sparkle 签名"; print(s)')"
          "$tools/sign_update" --verify --ed-key-file "$key" "dist/$package.dmg" "$signature"
          # 再用客户端内置公钥验证，避免公私钥配置不匹配却发布成功。
          swift - "$SPARKLE_PUBLIC_KEY" "dist/$package.dmg" "$signature" <<'SWIFT'
          import CryptoKit
          import Foundation
          let arguments = CommandLine.arguments
          let key = try Curve25519.Signing.PublicKey(rawRepresentation: Data(base64Encoded: arguments[1])!)
          let archive = try Data(contentsOf: URL(fileURLWithPath: arguments[2]), options: .mappedIfSafe)
          guard let signature = Data(base64Encoded: arguments[3]), key.isValidSignature(signature, for: archive) else {
              fputs("error: Sparkle 签名与客户端公钥不匹配\n", stderr)
              exit(1)
          }
          SWIFT

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          dmg="dist/1Agent-${tag}-mac-arm64.dmg"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/appcast.xml" "dist/latest.json" "dist/latest.json.sig" "$dmg" --clobber
            gh release delete-asset "$tag" "1Agent-${tag}-mac-arm64.zip" --yes || true
          else
            args=(release create "$tag" "dist/appcast.xml" "dist/latest.json" "dist/latest.json.sig" "$dmg" --title "$tag" --notes-file dist/notes.txt)
            if [[ "$tag" == *-* ]]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--latest)
            fi
            gh "${args[@]}"
          fi
